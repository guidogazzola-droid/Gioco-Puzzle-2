# XcodeGen spec.
#
# LineFlow.xcodeproj is committed and is the project you open. This spec is the
# regeneration path: if the project file is ever damaged by a bad merge, run
#
#     xcodegen generate
#
# to rebuild an equivalent project from the folder layout. The committed project
# uses Xcode 16 file-system-synchronized groups (no per-file entries), which is
# what keeps merge conflicts in the project file rare in the first place.

name: LineFlow
options:
  bundleIdPrefix: com.sabettaworks
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PuzzleKit:
    path: PuzzleKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"

targets:
  LineFlow:
    type: application
    platform: iOS
    sources:
      - path: LineFlow
        excludes:
          - "Info.plist"
          - "LineFlow.entitlements"
    dependencies:
      - package: PuzzleKit
        product: PuzzleKit
    info:
      path: LineFlow/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sabettaworks.LineFlowSW
        INFOPLIST_FILE: LineFlow/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: LineFlow/LineFlow.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - LineFlowTests
      gatherCoverageData: true
      storeKitConfiguration: Configuration/Products.storekit

  LineFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LineFlowTests
    dependencies:
      - target: LineFlow
      - package: PuzzleKit
        product: PuzzleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sabettaworks.LineFlowSW.tests
        GENERATE_INFOPLIST_FILE: YES
