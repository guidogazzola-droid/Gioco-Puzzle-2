name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need a Mac. Runs first and fast: the generation
  # algorithm, the palettes, both languages, the product wiring and the
  # project file.
  verify:
    name: Verify (no Xcode required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run every non-Xcode check
        run: python3 tools/verify.py

  # PuzzleKit is deliberately free of UIKit and SwiftUI so its whole test
  # suite runs as a plain Swift package, without a simulator.
  puzzlekit:
    name: PuzzleKit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Test
        working-directory: PuzzleKit
        run: swift test --parallel

  # The app target needs Xcode 16 or newer: the project uses file-system
  # synchronised groups (objectVersion 77).
  app:
    name: App build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      # Pin to whatever iPhone simulator the runner actually has. Naming a
      # model directly breaks every time the runner image moves on.
      - name: Pick a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
import json, sys
devices = json.load(sys.stdin)["devices"]
for runtime in sorted(devices):
    if "iOS" not in runtime:
        continue
    for device in devices[runtime]:
        if device.get("isAvailable") and device["name"].startswith("iPhone"):
            print(device["udid"])
            raise SystemExit
raise SystemExit("no available iPhone simulator")
')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -m1 -A0 "$udid" || true

      - name: Build and test
        run: |
          xcodebuild test \
            -project PrismFlow.xcodeproj \
            -scheme PrismFlow \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
